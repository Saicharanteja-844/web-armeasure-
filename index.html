<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AR Measure App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .hud-glass {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    #ARButton {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      bottom: auto !important;
      background: linear-gradient(135deg, #4f46e5, #7c3aed) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.35) !important;
      border-radius: 9999px !important;
      padding: 14px 32px !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      letter-spacing: 0.5px !important;
      text-transform: uppercase !important;
      z-index: 99999 !important;
      box-shadow: 0 8px 28px rgba(79, 70, 229, 0.6) !important;
      cursor: pointer !important;
    }
    /* Fixed 2D Center Crosshair */
    .crosshair-center {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 30;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="relative">

  <!-- Fixed 2D Target Crosshair -->
  <div class="crosshair-center flex items-center justify-center">
    <div id="crosshair-ring" class="w-12 h-12 rounded-full border-2 border-white/80 flex items-center justify-center transition-transform duration-150">
      <div id="crosshair-dot" class="w-2 h-2 rounded-full bg-white shadow-[0_0_8px_#ffffff]"></div>
    </div>
  </div>

  <!-- WebXR DOM Overlay Container -->
  <div id="ar-overlay" class="fixed inset-0 z-40 pointer-events-none flex flex-col justify-between" 
       style="padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); padding-left: 16px; padding-right: 16px;">
    
    <!-- Top HUD: Mode Selector, Readout Pill & Unit Switcher -->
    <div class="w-full max-w-sm mx-auto flex flex-col gap-2.5 pointer-events-auto">
      
      <!-- Top Row: Segmented Switch & Unit -->
      <div class="flex items-center justify-between gap-2">
        <div class="hud-glass rounded-2xl p-1 flex space-x-1 shadow-2xl flex-1">
          <button id="btn-linear" onclick="setMode('linear')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold text-slate-300 hover:text-white transition-all">
            Linear
          </button>
          <button id="btn-height" onclick="setMode('height')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold bg-indigo-600 text-white transition-all shadow">
            Height
          </button>
        </div>

        <div class="hud-glass rounded-2xl p-1 shadow-2xl">
          <select id="unit-selector" onchange="setUnit(this.value)" class="bg-transparent text-xs font-bold text-white px-3 py-2 focus:outline-none cursor-pointer">
            <option value="cm" class="bg-slate-900 text-white" selected>cm</option>
            <option value="m" class="bg-slate-900 text-white">m</option>
            <option value="in" class="bg-slate-900 text-white">in</option>
            <option value="ft" class="bg-slate-900 text-white">ft</option>
          </select>
        </div>
      </div>

      <!-- Top Measurement Banner (Clean & Non-Obtrusive) -->
      <div class="hud-glass px-4 py-2.5 rounded-2xl flex items-center justify-between shadow-2xl border border-indigo-500/30">
        <div>
          <div id="status-text" class="text-[9px] uppercase font-bold text-indigo-300 tracking-wider">Aim at Base & Tap Place Point</div>
          <div id="readout-val" class="text-2xl font-mono font-bold text-white leading-tight">0.0 cm</div>
        </div>
        <div id="lock-badge" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      </div>

    </div>

    <!-- Bottom Controls: Clear & Place Point -->
    <div class="w-full max-w-sm mx-auto flex items-center justify-center space-x-4 pointer-events-auto">
      <button onclick="clearPoints()" class="w-14 h-14 rounded-2xl bg-slate-900/90 hover:bg-rose-950 text-slate-300 hover:text-rose-400 flex items-center justify-center border border-slate-700 shadow-2xl active:scale-90 transition" title="Clear Points">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>

      <button id="btn-action" onclick="placePoint()" class="flex-1 h-14 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-xl shadow-indigo-600/40 active:scale-95 transition flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Place Point
      </button>
    </div>

  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let scene, camera, renderer, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let mode = 'height';
    let unit = 'cm';
    let basePoint = null;
    let liveLine = null;
    let liveHeightColumn = null;

    // Smoothed Target Positioning
    const rawTargetPos = new THREE.Vector3();
    const smoothedTargetPos = new THREE.Vector3();

    const placedAnchors = [];
    const solidLines = [];

    const statusText = document.getElementById('status-text');
    const readoutVal = document.getElementById('readout-val');
    const lockBadge = document.getElementById('lock-badge');
    const overlayElement = document.getElementById('ar-overlay');
    const crosshairDot = document.getElementById('crosshair-dot');
    const crosshairRing = document.getElementById('crosshair-ring');

    window.setMode = (newMode) => {
      mode = newMode;
      clearPoints();
      document.getElementById('btn-linear').className = newMode === 'linear'
        ? "flex-1 py-2 px-3 rounded-xl text-xs font-bold bg-indigo-600 text-white transition-all shadow"
        : "flex-1 py-2 px-3 rounded-xl text-xs font-bold text-slate-300 hover:text-white transition-all";
      document.getElementById('btn-height').className = newMode === 'height'
        ? "flex-1 py-2 px-3 rounded-xl text-xs font-bold bg-indigo-600 text-white transition-all shadow"
        : "flex-1 py-2 px-3 rounded-xl text-xs font-bold text-slate-300 hover:text-white transition-all";
      statusText.innerText = mode === 'linear' ? "Aim at Point A & Tap" : "Aim at Base & Tap";
    };

    window.setUnit = (newUnit) => {
      unit = newUnit;
      if (!basePoint) readoutVal.innerText = formatDist(0);
    };

    window.clearPoints = () => {
      if (navigator.vibrate) navigator.vibrate(30);
      basePoint = null;
      if (liveLine) {
        scene.remove(liveLine);
        liveLine = null;
      }
      if (liveHeightColumn) {
        scene.remove(liveHeightColumn);
        liveHeightColumn = null;
      }
      placedAnchors.forEach(mesh => scene.remove(mesh));
      solidLines.forEach(line => scene.remove(line));
      placedAnchors.length = 0;
      solidLines.length = 0;
      readoutVal.innerText = formatDist(0);
      statusText.innerText = mode === 'linear' ? "Aim at Point A & Tap" : "Aim at Base & Tap";
    };

    window.placePoint = () => {
      if (navigator.vibrate) navigator.vibrate(40);

      const targetPos = smoothedTargetPos.clone();

      if (!basePoint) {
        basePoint = targetPos.clone();
        const baseMarker = createMarker(basePoint, 0x10b981);
        scene.add(baseMarker);
        placedAnchors.push(baseMarker);

        statusText.innerText = mode === 'linear' ? "Point A Set! Move to Point B" : "Base Set! Raise Camera to Top";
      } else {
        let finalPos = targetPos.clone();

        if (mode === 'height') {
          // Lock strictly to the vertical column above base
          finalPos = new THREE.Vector3(basePoint.x, targetPos.y, basePoint.z);
        }

        const endMarker = createMarker(finalPos, 0xf59e0b);
        scene.add(endMarker);
        placedAnchors.push(endMarker);

        const tube = createSolidLine(basePoint, finalPos, mode === 'linear' ? 0x10b981 : 0xf59e0b);
        scene.add(tube);
        solidLines.push(tube);

        const measured = mode === 'linear' 
          ? basePoint.distanceTo(finalPos) 
          : Math.abs(finalPos.y - basePoint.y);

        statusText.innerText = mode === 'linear' ? "Linear Distance Complete" : "Height Complete";
        readoutVal.innerText = formatDist(measured);

        if (liveLine) {
          scene.remove(liveLine);
          liveLine = null;
        }
        if (liveHeightColumn) {
          scene.remove(liveHeightColumn);
          liveHeightColumn = null;
        }
        basePoint = null;
      }
    };

    function createMarker(pos, colorHex) {
      const geo = new THREE.SphereGeometry(0.016, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      return mesh;
    }

    function createSolidLine(p1, p2, colorHex) {
      const path = new THREE.LineCurve3(p1, p2);
      const geo = new THREE.TubeGeometry(path, 1, 0.005, 8, false);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      return new THREE.Mesh(geo, mat);
    }

    function formatDist(meters) {
      switch (unit) {
        case 'cm': return (meters * 100).toFixed(1) + ' cm';
        case 'm': return meters.toFixed(2) + ' m';
        case 'in': return (meters * 39.37).toFixed(1) + ' in';
        case 'ft': return (meters * 3.281).toFixed(2) + ' ft';
        default: return meters.toFixed(2) + ' m';
      }
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.4);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: overlayElement }
      });
      document.body.appendChild(arButton);

      // 3D Visual Reticle Ring on Floor/Plane
      const reticleGroup = new THREE.Group();
      const ringGeo = new THREE.RingGeometry(0.032, 0.042, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x818cf8, side: THREE.DoubleSide });
      reticleGroup.add(new THREE.Mesh(ringGeo, ringMat));

      const innerDotGeo = new THREE.CircleGeometry(0.006, 16).rotateX(-Math.PI / 2);
      const innerDotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
      reticleGroup.add(new THREE.Mesh(innerDotGeo, innerDotMat));

      reticle = reticleGroup;
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      renderer.xr.addEventListener('sessionstart', () => {
        statusText.innerText = "Aim at Base & Tap Place Point";
      });

      renderer.xr.addEventListener('sessionend', () => {
        statusText.innerText = "Tap 'START AR'";
        hitTestSourceRequested = false;
        hitTestSource = null;
      });

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        const refSpace = renderer.xr.getReferenceSpace();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            reticle.visible = false;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitResults = frame.getHitTestResults(hitTestSource);
          if (hitResults.length > 0) {
            const hit = hitResults[0];
            const pose = hit.getPose(refSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            rawTargetPos.setFromMatrixPosition(reticle.matrix);

            crosshairDot.style.background = "#34d399";
            crosshairRing.style.borderColor = "#34d399";
            lockBadge.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
          } else {
            // Smooth Camera-forward raycast fallback
            const forward = new THREE.Vector3(0, 0, -1.2).applyQuaternion(camera.quaternion);
            rawTargetPos.copy(camera.position).add(forward);
            reticle.visible = false;

            crosshairDot.style.background = "#ffffff";
            crosshairRing.style.borderColor = "rgba(255, 255, 255, 0.7)";
            lockBadge.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
          }
        }

        // LERP Position Smoothing to eliminate jitter
        smoothedTargetPos.lerp(rawTargetPos, 0.25);

        // Live Measuring Pillar / Line
        if (basePoint) {
          if (mode === 'height') {
            const topPos = new THREE.Vector3(basePoint.x, smoothedTargetPos.y, basePoint.z);
            const deltaH = Math.abs(smoothedTargetPos.y - basePoint.y);
            readoutVal.innerText = formatDist(deltaH);

            if (liveHeightColumn) scene.remove(liveHeightColumn);
            if (deltaH > 0.005) {
              const path = new THREE.LineCurve3(basePoint, topPos);
              const geo = new THREE.TubeGeometry(path, 1, 0.004, 8, false);
              const mat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
              liveHeightColumn = new THREE.Mesh(geo, mat);
              scene.add(liveHeightColumn);
            }
          } else {
            const dist = basePoint.distanceTo(smoothedTargetPos);
            readoutVal.innerText = formatDist(dist);

            if (liveLine) scene.remove(liveLine);
            const geo = new THREE.BufferGeometry().setFromPoints([basePoint, smoothedTargetPos]);
            const mat = new THREE.LineDashedMaterial({ color: 0x818cf8, dashSize: 0.03, gapSize: 0.02 });
            liveLine = new THREE.Line(geo, mat);
            liveLine.computeLineDistances();
            scene.add(liveLine);
          }
        }
      }
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
